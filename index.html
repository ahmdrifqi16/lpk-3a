<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>To-Do List</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app">
      <h1>📝 To-Do List Ahmad Rifqi</h1>

      <form id="form-todo">
        <label for="input-todo" class="sr-only">Tugas baru</label>
        <input type="text" id="input-todo" placeholder="Tulis tugas baru..." autocomplete="off" required />
        <button type="submit">Tambah</button>
      </form>

      <p id="stats" aria-live="polite">0 tugas belum selesai</p>

      <ul id="list-todo"></ul>
    </div>

    <script src="app.js"></script>
  </body>
</html>
